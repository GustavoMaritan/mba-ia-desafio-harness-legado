# Postgres compartilhado por todas as cópias (worktrees) do Balcão.
# O nome do projeto é fixo, então qualquer cópia enxerga o mesmo container;
# cada cópia usa a própria base (balcao_<pasta>_<id>), criada pelo scripts/subir.sh.
name: balcao-compartilhado

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
      POSTGRES_DB: balcao
    ports:
      - "${BALCAO_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U balcao -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
